services:
  backend:
    build: .
    container_name: codesoft-backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://codesoft:codesoft@postgres:5432/codesoft
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploying}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: codesoft-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: codesoft-postgres
    environment:
      POSTGRES_DB: codesoft
      POSTGRES_USER: codesoft
      POSTGRES_PASSWORD: codesoft
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesoft -d codesoft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
