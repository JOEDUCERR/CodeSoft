services:
  backend:
    build: .
    container_name: codesoft-backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://codesoft:codesoft@postgres:5432/codesoft
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploying}
      SANDBOX_ROOT: /tmp/codesoft
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/codesoft:/tmp/codesoft

  worker:
    build: .
    container_name: codesoft-worker
    command: python runner.py
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://codesoft:codesoft@postgres:5432/codesoft
      SANDBOX_ROOT: /tmp/codesoft
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/codesoft:/tmp/codesoft

  redis:
    image: redis:7-alpine
    container_name: codesoft-redis
    ports:
      - "127.0.0.1:6379:6379"  
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: codesoft-postgres
    environment:
      POSTGRES_DB: codesoft
      POSTGRES_USER: codesoft
      POSTGRES_PASSWORD: codesoft
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesoft -d codesoft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
