<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · CodeSoft</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body class="auth-page" data-page="register">
  <header class="auth-top">
    <a class="brand" href="login.html">CodeSoft</a>
  </header>
  <main class="auth-card">
    <h1>Create account</h1>
    <p class="muted">Creates a demo session in this browser. No account is stored on a server.</p>
    <div id="form-error" class="form-error" hidden></div>
    <form id="register-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <p class="muted">At least 8 characters, including a letter and a number.</p>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn" type="submit" id="register-submit">Create account</button>
    </form>
    <p class="guest-foot">Already have an account? <a href="login.html">Login</a></p>
  </main>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/register.js"></script>
</body>
</html>
